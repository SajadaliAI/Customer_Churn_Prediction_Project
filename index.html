<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Churn Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin-top: 50px; background: #fff; padding: 20px; border-radius: 10px; }
        .result { margin-top: 20px; padding: 15px; text-align: center; font-weight: bold; color: #fff; border-radius: 8px; }
        .churn { background-color: #dc3545; }
        .no-churn { background-color: #28a745; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center">Customer Churn Prediction</h2>
    <form method="post" action="/predict">
        <div class="mb-3">
            <label>Gender (0=Female,1=Male)</label>
            <input type="number" name="gender" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>SeniorCitizen (0/1)</label>
            <input type="number" name="SeniorCitizen" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Partner (0/1)</label>
            <input type="number" name="Partner" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Dependents (0/1)</label>
            <input type="number" name="Dependents" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Tenure (months)</label>
            <input type="number" name="tenure" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>PhoneService (0/1)</label>
            <input type="number" name="PhoneService" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>PaperlessBilling (0/1)</label>
            <input type="number" name="PaperlessBilling" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>MonthlyCharges</label>
            <input type="number" step="0.01" name="MonthlyCharges" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>TotalCharges</label>
            <input type="number" step="0.01" name="TotalCharges" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Predict</button>
    </form>

    {% if result %}
        <div class="result {% if result == 'Churn' %}churn{% else %}no-churn{% endif %}">
            {{ result }} (Probability: {{ probability }}%)
        </div>
    {% endif %}
</div>
</body>
</html>
